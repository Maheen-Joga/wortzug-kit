[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wortzug-kit"
version = "0.1.0"
description = "Structured German translation with formal/colloquial variants and a word-by-word lexicon."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Maheen Joga" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
wortzug = "wortzug.cli:main"

[tool.setuptools]
packages = ["wortzug"]

[tool.pytest.ini_options]
testpaths = ["tests"]
